name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        required: true
        type: choice
        options: [staging, production]
        default: staging
      canary_percentage:
        description: "Percentage of traffic for production canary"
        required: false
        default: "10"
        type: string

jobs:
  build-artifacts:
    name: Build release bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Prepare dist folder
        run: mkdir -p dist
      - name: Build API
        run: go build -o dist/workpulse-api ./cmd/server
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend deps
        run: npm ci
        working-directory: web
      - name: Build frontend assets
        run: npm run build
        working-directory: web
      - name: Archive artifacts
        run: |
          tar -czf workpulse-release.tar.gz dist/workpulse-api web/dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workpulse-${{ github.sha }}
          path: workpulse-release.tar.gz

  staging:
    name: Deploy to staging
    needs: build-artifacts
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.environment == 'staging' }}
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: workpulse-${{ github.sha }}
      - name: Staging rollout
        run: |
          echo "Deploying staging bundle"
          # Example: scp workpulse-release.tar.gz user@staging:/opt/workpulse
          # Example: systemctl restart workpulse

  canary:
    name: Canary deploy
    needs: build-artifacts
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.environment == 'production' }}
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: workpulse-${{ github.sha }}
      - name: Push canary slice
        run: |
          echo "Rolling out canary to ${{ github.event.inputs.canary_percentage }}% of production"
          # Example: kubectl apply -f k8s/canary.yaml --record

  production:
    name: Promote to production
    needs: [build-artifacts, canary]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.environment == 'production' }}
    environment:
      name: production
      deployment-branches: ["main"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: workpulse-${{ github.sha }}
      - name: Full rollout
        run: |
          echo "Promoting artifact to production"
          # Example: kubectl rollout restart deployment/workpulse-api
